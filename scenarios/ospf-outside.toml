# ospf-outside: a scenario of the conformance kit, written by `florn-conformance scenarios`.
# Its digest is recorded in digests.toml; the readme says how to run it.

florn = 1
name = "ospf-outside"
domains = ["core", "network"]

[time]
tick = "1ns"
end = "600ns"

[order]
tie = "by-identity"

[seed]
root = 1

[limits.default]
memory = "2MiB"

[modules.ospf]
sha256 = "61bef461f1af90dbd38cd77e92f60cfea4a712501414336c3077aa00b9ff158c"
contract = "florn:network/router@0.1.0"

[[actors]]
id = 1
name = "a1"
kind = "module"
module = "ospf"
ports = [{ id = 0, name = "p0", type = "network/interface" }]
[actors.config]
hello = "50ns"
dead = "200ns"

[[actors]]
id = 2
name = "a2"
kind = "module"
module = "ospf"
ports = [{ id = 0, name = "p0", type = "network/interface" }]
[actors.config]
hello = "50ns"
dead = "200ns"
area = 1

[[connections]]
id = 1000
name = "c0"
type = "network/link"
ports = ["a1.p0", "a2.p0"]
[connections.attrs]
delay = "2ns"
