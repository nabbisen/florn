# zero-delay: a scenario of the conformance kit, written by `florn-conformance scenarios`.
# Its digest is recorded in digests.toml; the readme says how to run it.

florn = 1
name = "zero-delay"
domains = ["core"]

[time]
tick = "1ns"
end = "100ns"

[order]
tie = "by-identity"

[seed]
root = 1

[limits.default]
memory = "2MiB"

[modules.pinger]
sha256 = "19f77b06a868f4fbc168b1f419eee3184b2e931575300b0bc259c6f32e0228fd"
contract = "florn:core/guest@0.1.0"

[[actors]]
id = 1
name = "a1"
kind = "module"
module = "pinger"
ports = [{ id = 0, name = "p0", type = "core/port" }]
[actors.config]
period = 0
at-init = true
echo = true

[[actors]]
id = 2
name = "a2"
kind = "module"
module = "pinger"
ports = [{ id = 0, name = "p0", type = "core/port" }]
[actors.config]
period = 0
echo = true

[[connections]]
id = 1000
name = "c0"
ports = ["a1.p0", "a2.p0"]
