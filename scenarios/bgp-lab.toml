# bgp-lab: a scenario of the conformance kit, written by `florn-conformance scenarios`.
# Its digest is recorded in digests.toml; the readme says how to run it.

florn = 1
name = "bgp-lab"
domains = ["core", "network"]

[time]
tick = "1ns"
end = "3000ns"

[order]
tie = "by-identity"

[seed]
root = 1

[limits.default]
memory = "2MiB"

[modules.bgp]
sha256 = "149229669aecbef02612d941318e56b93841410a51c7401d512df48279565052"
contract = "florn:network/router@0.1.0"

[[actors]]
id = 1
name = "a1"
kind = "module"
module = "bgp"
ports = [{ id = 0, name = "p0", type = "network/interface" }, { id = 1, name = "p1", type = "network/interface" }]
[actors.config]
as = 1
hold = "90ns"
keepalive = "30ns"
local-pref = "0=200,1=100"

[[actors]]
id = 2
name = "a2"
kind = "module"
module = "bgp"
ports = [{ id = 0, name = "p0", type = "network/interface" }, { id = 1, name = "p1", type = "network/interface" }]
[actors.config]
as = 2
hold = "90ns"
keepalive = "30ns"

[[actors]]
id = 3
name = "a3"
kind = "module"
module = "bgp"
ports = [{ id = 0, name = "p0", type = "network/interface" }, { id = 1, name = "p1", type = "network/interface" }]
[actors.config]
as = 3
hold = "90ns"
keepalive = "30ns"

[[actors]]
id = 4
name = "a4"
kind = "module"
module = "bgp"
ports = [{ id = 0, name = "p0", type = "network/interface" }, { id = 1, name = "p1", type = "network/interface" }]
[actors.config]
as = 4
hold = "90ns"
keepalive = "30ns"
networks = "10.4.0.0/16"
med = "0=10,1=20"

[[connections]]
id = 1000
name = "c0"
type = "network/link"
ports = ["a1.p0", "a2.p0"]
[connections.attrs]
delay = "2ns"

[[connections]]
id = 1001
name = "c1"
type = "network/link"
ports = ["a1.p1", "a3.p0"]
[connections.attrs]
delay = "2ns"

[[connections]]
id = 1002
name = "c2"
type = "network/link"
ports = ["a2.p1", "a4.p0"]
[connections.attrs]
delay = "2ns"

[[connections]]
id = 1003
name = "c3"
type = "network/link"
ports = ["a3.p1", "a4.p1"]
[connections.attrs]
delay = "2ns"

[[changes]]
at = "1000ns"
target = "c0"
[changes.payload]
enabled = false

[[changes]]
at = "2000ns"
target = "c0"
[changes.payload]
enabled = true
