name = "a1"
kind = "module"
module = "pinger"
ports = [{ id = 0, name = "p0", type = "core/port" }]
[actors.config]
payload = 1500

[[actors]]
id = 2
name = "a2"
kind = "module"
module = "bench_protocol"
ports = [{ id = 0, name = "p0", type = "core/port" }]

[[connections]]
