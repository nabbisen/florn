# bench-protocol: a scenario of the conformance kit, written by `florn-conformance scenarios`.
# Its digest is recorded in digests.toml; the readme says how to run it.

florn = 1
name = "bench-protocol"
domains = ["core"]

[time]
tick = "1ns"
end = "10000ns"

[order]
tie = "by-identity"

[seed]
root = 1

[limits.default]
memory = "2MiB"

[modules.pinger]
sha256 = "795b41b1ad7331e07f3bcbfc05ca635ad5cc92090921f457db9549f4af631ef9"
contract = "florn:core/guest@0.1.0"

[modules.bench_protocol]
sha256 = "f053e9d010c2ad7d6b1a65693f4b95532e4f5b845d7f7130087a65db3ad01913"
contract = "florn:core/guest@0.1.0"

[[actors]]
id = 1
name = "a1"
kind = "module"
module = "pinger"
ports = [{ id = 0, name = "p0", type = "core/port" }]
[actors.config]
payload = 1500

[[actors]]
id = 2
name = "a2"
kind = "module"
module = "bench_protocol"
ports = [{ id = 0, name = "p0", type = "core/port" }]

[[connections]]
id = 1000
name = "c0"
ports = ["a1.p0", "a2.p0"]
