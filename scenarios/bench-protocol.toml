florn = 1
name = "bench-protocol"
domains = ["core"]

[time]
tick = "1ns"
end = "10000ns"

[order]
tie = "by-identity"

[seed]
root = 1

[limits.default]
memory = "2MiB"

[modules.pinger]
sha256 = "779a18caaff5a00adf49df6a226ce2a635e81cbc955c9f3f8d6a12af1d35bc3b"
