# hostile-stamp: a scenario of the conformance kit, written by `florn-conformance scenarios`.
# Its digest is recorded in digests.toml; the readme says how to run it.

florn = 1
name = "hostile-stamp"
domains = ["core", "circuit"]

[time]
tick = "1ns"
end = "1000000ns"

[order]
tie = "by-identity"

[seed]
root = 1

[limits.default]
memory = "2MiB"

[modules.bad_device]
sha256 = "5d6817e1d1e87c03628dbd8eb0e9f4215523d824226e1859c486ae6a106a9624"
contract = "florn:circuit/device@0.1.0"

[[actors]]
id = 1
name = "vs"
kind = "builtin"
builtin = "circuit/voltage-source"
ports = [{ id = 0, name = "p", type = "circuit/pin" }, { id = 1, name = "n", type = "circuit/pin" }]
[actors.config]
v = "5V"

[[actors]]
id = 2
name = "r"
kind = "builtin"
builtin = "circuit/resistor"
ports = [{ id = 0, name = "a", type = "circuit/pin" }, { id = 1, name = "b", type = "circuit/pin" }]
[actors.config]
r = "1kohm"

[[actors]]
id = 3
name = "d"
kind = "module"
module = "bad_device"
ports = [{ id = 0, name = "a", type = "circuit/pin" }, { id = 1, name = "k", type = "circuit/pin" }]
[actors.config]
mode = "nan"
at = 5

[[actors]]
id = 4
name = "vm"
kind = "builtin"
builtin = "circuit/voltmeter"
ports = [{ id = 0, name = "p", type = "circuit/pin" }, { id = 1, name = "n", type = "circuit/pin" }]
[actors.config]
period = "100us"

[[connections]]
id = 100
name = "in"
type = "circuit/net"
ports = ["vs.p", "r.a"]

[[connections]]
id = 101
name = "mid"
type = "circuit/net"
ports = ["r.b", "d.a", "vm.p"]

[[connections]]
id = 102
name = "gnd"
type = "circuit/net"
ports = ["vs.n", "d.k", "vm.n"]
[connections.attrs]
ground = true
