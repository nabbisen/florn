# ospf-lab: a scenario of the conformance kit, written by `florn-conformance scenarios`.
# Its digest is recorded in digests.toml; the readme says how to run it.

florn = 1
name = "ospf-lab"
domains = ["core", "network"]

[time]
tick = "1ns"
end = "4500ns"

[order]
tie = "by-identity"

[seed]
root = 1

[limits.default]
memory = "2MiB"

[modules.ospf]
sha256 = "462dc26b5a580bdad724d4b0f4f067e5c28f1ae4d4c165053858721c1537659d"
contract = "florn:network/router@0.1.0"

[[actors]]
id = 1
name = "a1"
kind = "module"
module = "ospf"
ports = [{ id = 0, name = "p0", type = "network/interface" }, { id = 1, name = "p1", type = "network/interface" }, { id = 2, name = "p2", type = "network/interface" }]
[actors.config]
hello = "50ns"
dead = "200ns"

[[actors]]
id = 2
name = "a2"
kind = "module"
module = "ospf"
ports = [{ id = 0, name = "p0", type = "network/interface" }, { id = 1, name = "p1", type = "network/interface" }]
[actors.config]
hello = "50ns"
dead = "200ns"

[[actors]]
id = 3
name = "a3"
kind = "module"
module = "ospf"
ports = [{ id = 0, name = "p0", type = "network/interface" }, { id = 1, name = "p1", type = "network/interface" }, { id = 2, name = "p2", type = "network/interface" }]
[actors.config]
hello = "50ns"
dead = "200ns"

[[actors]]
id = 4
name = "a4"
kind = "module"
module = "ospf"
ports = [{ id = 0, name = "p0", type = "network/interface" }, { id = 1, name = "p1", type = "network/interface" }]
[actors.config]
hello = "50ns"
dead = "200ns"

[[connections]]
id = 1000
name = "c0"
type = "network/link"
ports = ["a1.p0", "a2.p0"]
[connections.attrs]
delay = "2ns"

[[connections]]
id = 1001
name = "c1"
type = "network/link"
ports = ["a2.p1", "a3.p0"]
[connections.attrs]
delay = "2ns"

[[connections]]
id = 1002
name = "c2"
type = "network/link"
ports = ["a3.p1", "a4.p0"]
[connections.attrs]
delay = "2ns"

[[connections]]
id = 1003
name = "c3"
type = "network/link"
ports = ["a4.p1", "a1.p1"]
[connections.attrs]
delay = "2ns"

[[connections]]
id = 1004
name = "c4"
type = "network/link"
ports = ["a1.p2", "a3.p2"]
[connections.attrs]
delay = "2ns"
[connections.attrs.per-port]
"a1.p2" = { cost = 5 }
"a3.p2" = { cost = 5 }

[[changes]]
at = "1500ns"
target = "c1"
[changes.payload]
enabled = false

[[changes]]
at = "3000ns"
target = "c1"
[changes.payload]
enabled = true
