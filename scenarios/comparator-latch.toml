# comparator-latch: a scenario of the conformance kit, written by `florn-conformance scenarios`.
# Its digest is recorded in digests.toml; the readme says how to run it.

florn = 1
name = "comparator-latch"
domains = ["core", "circuit"]

[time]
tick = "1ns"
end = "6000000ns"

[order]
tie = "by-identity"

[seed]
root = 1

[limits.default]
memory = "2MiB"

[[actors]]
id = 1
name = "vs"
kind = "builtin"
builtin = "circuit/voltage-source"
ports = [{ id = 0, name = "p", type = "circuit/pin" }, { id = 1, name = "n", type = "circuit/pin" }]
[actors.config]
v = "1V"

[[actors]]
id = 2
name = "r"
kind = "builtin"
builtin = "circuit/resistor"
ports = [{ id = 0, name = "a", type = "circuit/pin" }, { id = 1, name = "b", type = "circuit/pin" }]
[actors.config]
r = "1kohm"

[[actors]]
id = 3
name = "c"
kind = "builtin"
builtin = "circuit/capacitor"
ports = [{ id = 0, name = "a", type = "circuit/pin" }, { id = 1, name = "b", type = "circuit/pin" }]
[actors.config]
c = "1uF"
ic = "0V"

[[actors]]
id = 4
name = "vm"
kind = "builtin"
builtin = "circuit/voltmeter"
ports = [{ id = 0, name = "p", type = "circuit/pin" }, { id = 1, name = "n", type = "circuit/pin" }]
[actors.config]
period = "100us"

[[actors]]
id = 5
name = "cmp"
kind = "builtin"
builtin = "circuit/comparator"
ports = [{ id = 0, name = "p", type = "circuit/pin" }, { id = 1, name = "n", type = "circuit/pin" }, { id = 2, name = "y", type = "circuit/signal-out" }]
[actors.config]
threshold = "0.5V"
hysteresis = "0.2V"

[[connections]]
id = 100
name = "in"
type = "circuit/net"
ports = ["vs.p", "r.a"]

[[connections]]
id = 101
name = "cap"
type = "circuit/net"
ports = ["r.b", "c.a", "vm.p", "cmp.p"]

[[connections]]
id = 102
name = "gnd"
type = "circuit/net"
ports = ["vs.n", "c.b", "vm.n", "cmp.n"]
[connections.attrs]
ground = true

[[changes]]
at = "2000000ns"
target = "world:circuit"
[changes.payload]
actor = 1
v = "0V"

[[changes]]
at = "4000000ns"
target = "world:circuit"
[changes.payload]
actor = 1
v = "1V"
