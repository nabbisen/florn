# net-lan: a scenario of the conformance kit, written by `florn-conformance scenarios`.
# Its digest is recorded in digests.toml; the readme says how to run it.

florn = 1
name = "net-lan"
domains = ["core", "network"]

[time]
tick = "1ns"
end = "500ns"

[order]
tie = "by-identity"

[seed]
root = 1

[limits.default]
memory = "2MiB"

[modules.net_echo]
sha256 = "8b499081bc13e1fca3b9c2a287126ae2cf10378db6cda1d05e389b55cc01a989"
contract = "florn:network/router@0.1.0"

[[actors]]
id = 1
name = "a1"
kind = "module"
module = "net_echo"
ports = [{ id = 0, name = "p0", type = "network/interface" }]
[actors.config]
period = 10
payload = 64
echo = false

[[actors]]
id = 2
name = "a2"
kind = "module"
module = "net_echo"
ports = [{ id = 0, name = "p0", type = "network/interface" }]
[actors.config]
echo = false

[[actors]]
id = 3
name = "a3"
kind = "module"
module = "net_echo"
ports = [{ id = 0, name = "p0", type = "network/interface" }]
[actors.config]
echo = false

[[connections]]
id = 1000
name = "c0"
type = "network/lan"
ports = ["a1.p0", "a2.p0", "a3.p0"]
[connections.attrs]
delay = "2ns"
loss = 0.2
