# florn continuous integration (ROADMAP S0-19).
#
# Runners: ubuntu-latest (x86-64), ubuntu-24.04-arm (AArch64), macos-latest (Apple Silicon, AArch64;
# the only runner with Safari's WebKit). Three CPU/OS combinations cover Tier 2 of RFC 001 for the
# native Host. The browser matrix (Chromium and Firefox on Linux, WebKit on macOS, through
# Playwright) runs the conformance kit's scenarios and benchmarks under the browser Host.
#
# Only GitHub's own actions are used; tools are installed from crates.io and npm with lock files.
# RFC 006 rule 5 steps 4 and 5 (licences, advisories, fuzzing) run here: the fuzz job weekly, on
# dispatch and on a tag.

name: ci

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          uname -m
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint, native (every target, warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint, wasm32 (the browser crates)
        run: cargo clippy --locked --target wasm32-unknown-unknown -p florn-engine-web -p florn-platform-web -p florn-ui-web -- -D warnings
      - name: Check, native
        run: cargo check --workspace --all-targets --locked
      - name: Test, native
        run: cargo test --workspace --locked
      - name: Check, wasm32 (the crates that compile for the browser)
        run: cargo check --locked --target wasm32-unknown-unknown -p florn-kernel -p florn-abi -p florn-model -p florn-admission -p florn-control -p florn-host -p florn-engine -p florn-engine-web -p florn-platform -p florn-platform-web -p florn-guest -p florn-ui-model -p florn-ui-scene -p florn-ui-web
      - name: Guests (the SDK's example modules for the wasm32 target)
        run: cargo build --locked --release --target wasm32-unknown-unknown -p florn-guest --examples
      - name: Figures, quick (the kit's benchmarks run; the published figures come from a dispatched or tagged run)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: cargo run --locked --release -p florn-conformance -- figures --quick
      - name: Figures (RFC 005 rule 11 and RFC 003 section 7; the release notes copy this table)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        run: cargo run --locked --release -p florn-conformance -- figures
      - name: Dependency direction (RFC 005 rules 1 and 43)
        run: python3 -I ci/check-deps.py
      - name: The shell reaches the Host through the control interface only (RFC 005 rule 25)
        run: ci/check-shell-exports.sh
      - name: Lint, the shell (wasm32, feature shell)
        run: cargo clippy --locked --target wasm32-unknown-unknown -p florn-ui-web --features shell --bin florn-ui-web -- -D warnings

  browser:
    name: browser (${{ matrix.browsers }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chromium,firefox
          - os: macos-latest
            browsers: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-browser-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.126-${{ matrix.os }}
      - name: wasm-bindgen (the shell's bindings; the version the crate pins)
        run: command -v wasm-bindgen && wasm-bindgen --version | grep -q "0.2.126" || cargo install --locked wasm-bindgen-cli --version 0.2.126
      - name: The Host's worker module and the shell (RFC 005 rules 32 and 38)
        run: ci/build-shell.sh
      - name: The runner (a checkpoint crosses the Hosts, RFC 009 rule 6)
        run: cargo build --locked --release -p florn
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci/browser/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.os }}-${{ hashFiles('ci/browser/package-lock.json') }}
      - name: Playwright (test tooling, pinned by the lock file; nothing of it is linked into florn)
        working-directory: ci/browser
        run: |
          npm ci
          npx playwright install --with-deps $(echo "${{ matrix.browsers }}" | tr ',' ' ')
      - name: The conformance kit under the browser Host (AC-001, AC-002, AC-007; RFC 005 section 11)
        working-directory: ci/browser
        run: node run.js --browsers ${{ matrix.browsers }}
      - name: The journeys through the application (AC-008 to AC-011; RFC 005 rules 38 to 41)
        if: ${{ !cancelled() }}
        working-directory: ci/browser
        run: node journeys.js --browsers ${{ matrix.browsers }}

  fuzz:
    name: fuzz (RFC 006 rule 7; weekly, on dispatch, and on a tag)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nightly toolchain (cargo-fuzz needs it; nothing of it ships)
        run: rustup toolchain install nightly --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry
            fuzz/target
          key: fuzz-${{ hashFiles('fuzz/Cargo.lock', 'Cargo.lock') }}
      - name: cargo-fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --version 0.13.2 --locked
      # The corpus grows from run to run: restore the latest, save the new one even if a target
      # crashed, so that the inputs that found it are kept.
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Every target, three minutes each (fails when a target crashes)
        run: ci/fuzz.sh 180
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Crash inputs, if any
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  licences:
    name: licences and advisories (RFC 006 rule 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2
      - name: Install cargo-deny
        run: command -v cargo-deny || cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo deny
        run: cargo deny check licenses advisories bans sources

  docs:
    name: docs (mdbook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-0.5.4
      - name: Install mdbook
        run: command -v mdbook || cargo install mdbook --version 0.5.4 --locked
      - name: Build the book
        run: mdbook build docs
      - name: RFC index is consistent (both directions)
        run: ci/check-rfc-index.sh
      - name: RFC invariants (the status line is the folder; relative links resolve)
        run: ci/check-rfc-invariants.sh
      - name: No public file names a private path
        run: ci/check-private-paths.sh
      - name: The controls fail when a violation is planted (fuzz, index, invariants, private paths, the opener)
        run: ci/test-gates.sh
      - name: Forbidden words in catalogues (RFC 006 §6)
        run: ci/forbidden-words.sh
