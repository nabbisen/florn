# cargo-deny configuration. RFC 006 rule 6: permissive licences only; every copyleft licence,
# including MPL-2.0, is refused. An exception is an amendment of that rule, never an entry here.

[graph]
# The features florn builds: the shell's included; the framework's server-side features,
# which florn never builds, are not weighed (they would bring their own stacks).
all-features = false
features = ["florn-ui-web/shell"]

[licenses]
# Permissive licences, as RFC 006 rule 6 requires; the last is the Boost licence of a
# hashing crate the shell's framework uses at build time.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[advisories]
# RFC 006 rule 5, step 4: advisories are checked on every build. The two notices below are
# "unmaintained" notices on build-time dependencies of the shell's framework (a proc-macro
# helper and a YAML reader of the catalogue parser), none of which ships in florn; they are
# listed here with their reasons, as RFC 006's status records.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste: a proc-macro the framework's macros use at build time; nothing of it ships" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: the catalogue parser's YAML reader, at build time; florn's catalogues are JSON" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are path dependencies without a version: unpublished (RFC 005 section 9).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
