[package]
name = "florn-host"
description = "The Host: kernel, admission, model, and domains over the engine and platform adapter traits; run loop, instance pool, checkpoint export, diagnostic log, run record"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
florn-kernel = { workspace = true }
florn-abi = { workspace = true }
florn-model = { workspace = true }
florn-admission = { workspace = true }
florn-control = { workspace = true }
florn-engine = { workspace = true }
florn-platform = { workspace = true }
blake3 = { workspace = true }
toml = { workspace = true }
zip = { workspace = true }
wat = { workspace = true, optional = true }
wit-component = { workspace = true, optional = true }
wit-parser = { workspace = true, optional = true }
wasm-encoder = { workspace = true, optional = true }

[features]
# Hand-written guests of the core world and a scenario builder, for tests of the Host, the runner
# and the kit.
test-guests = ["dep:wat", "dep:wit-component", "dep:wit-parser", "dep:wasm-encoder"]

[dev-dependencies]
florn-engine-wasmtime = { workspace = true }
florn-host = { workspace = true, features = ["test-guests"] }
