[package]
name = "florn-conformance"
description = "The conformance kit: guests, scenarios with recorded digests, the RFC verification tables, the crossing and cost benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
florn-host = { workspace = true }
florn-test-guests = { workspace = true }
florn-kernel = { workspace = true }
florn-abi = { workspace = true }
florn-model = { workspace = true }
florn-admission = { workspace = true }
florn-control = { workspace = true }
florn-engine = { workspace = true, features = ["conformance", "bench"] }
florn-engine-wasmtime = { workspace = true }
florn-platform = { workspace = true }
florn-platform-native = { workspace = true }
florn-domain-network = { workspace = true }
wat = { workspace = true }
wasm-encoder = { workspace = true }
wit-parser = { workspace = true }
wit-component = { workspace = true }
toml = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }

[[bin]]
name = "florn-conformance"
path = "src/main.rs"

[dev-dependencies]
florn-ui-model = { workspace = true }
florn-ui-scene = { workspace = true }
