[package]
name = "florn-engine"
description = "The engine adapter trait (RFC 005 rule 5), and the conformance cases every adapter passes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = true

[dependencies]
florn-abi = { workspace = true }
wat = { workspace = true, optional = true }

[features]
# The adapter conformance cases of `conformance`, run by each adapter's tests.
conformance = ["dep:wat", "cases"]
# The cases of floats, lists and the post-return call over a prebuilt guest (`cases`), which the
# browser test page runs too: no assembler is needed to run them.
cases = []
# The benchmark drivers of the conformance kit and the browser test page.
bench = []
