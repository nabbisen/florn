[package]
name = "florn-guest-cps"
description = "The guest SDK for the composed world of RFC 012 rule 22 (florn:cps@0.1.0): a controller on a network acting on a plant"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = true
readme = "README.md"

[dependencies]
florn-guest = { workspace = true, default-features = false }
wit-bindgen = { workspace = true }

[features]
default = ["std"]
std = ["florn-guest/std"]
no-std = ["florn-guest/no-std"]

[[example]]
name = "networked_pid"
crate-type = ["cdylib"]
