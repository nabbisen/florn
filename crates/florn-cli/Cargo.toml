[package]
name = "florn-cli"
description = "The headless runner, binary `florn`: run, replay, admit, probe"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
florn-control = { workspace = true }
florn-host = { workspace = true }
florn-engine-wasmtime = { workspace = true }
florn-platform-native = { workspace = true }
florn-model = { workspace = true }

[dev-dependencies]
florn-host = { workspace = true, features = ["test-guests"] }
wat = { workspace = true }

[[bin]]
name = "florn"
path = "src/main.rs"
