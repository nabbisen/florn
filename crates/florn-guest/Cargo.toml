[package]
name = "florn-guest"
description = "The guest SDK (RFC 002 section 8): bindings, the manifest declaration, distributions, telemetry encoders, profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
wit-bindgen = { workspace = true }
libm = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { workspace = true, optional = true }

[features]
# The `std` profile (default): the standard library's allocator and panic behaviour.
default = ["std"]
std = ["wit-bindgen/std"]
# The `no_std` profile: the SDK's allocator and a panic handler that traps. Build with
# `--no-default-features --features no-std`.
no-std = ["dep:dlmalloc"]

[[example]]
name = "echo"
crate-type = ["cdylib"]

[[example]]
name = "probe"
crate-type = ["cdylib"]

[[example]]
name = "hostile_loop"
crate-type = ["cdylib"]

[[example]]
name = "hostile_recurse"
crate-type = ["cdylib"]

[[example]]
name = "hostile_grow"
crate-type = ["cdylib"]

[[example]]
name = "hostile_flood"
crate-type = ["cdylib"]

[[example]]
name = "hostile_bad_pointer"
crate-type = ["cdylib"]

[[example]]
name = "hostile_wasi"
crate-type = ["cdylib"]
