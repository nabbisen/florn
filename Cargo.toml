# florn workspace (RFC 005 §9). One workspace; crates prefixed `florn-`; dependency direction per
# RFC 005 rule 43, checked in CI by ci/check-deps.py. The root is a virtual manifest; the crate
# `crates/florn` reserves the name `florn`.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["nabbisen"]
repository = "https://github.com/nabbisen/florn"
rust-version = "1.99"
# No release exists yet. Publication is decided with the first pre-release (roadmap, release 0.1).
publish = false

[workspace.dependencies]
# Internal crates
florn-kernel = { path = "crates/florn-kernel" }
florn-abi = { path = "crates/florn-abi" }
florn-model = { path = "crates/florn-model" }
florn-admission = { path = "crates/florn-admission" }
florn-control = { path = "crates/florn-control" }
florn-host = { path = "crates/florn-host" }
florn-engine = { path = "crates/florn-engine" }
florn-engine-wasmtime = { path = "crates/florn-engine-wasmtime" }
florn-engine-web = { path = "crates/florn-engine-web" }
florn-platform = { path = "crates/florn-platform" }
florn-platform-native = { path = "crates/florn-platform-native" }
florn-platform-web = { path = "crates/florn-platform-web" }
florn-guest = { path = "crates/florn-guest" }
florn-conformance = { path = "crates/florn-conformance" }
florn-ui-model = { path = "crates/florn-ui-model" }
florn-ui-scene = { path = "crates/florn-ui-scene" }
# External, pinned (implementation handoff section 2); added to a crate only by the PR that needs it
wit-parser = "=0.261.0"
toml = "=1.1.8"
sha2 = "=0.11.1"
zip = { version = "=9.0.4", default-features = false }
blake3 = "=1.8.7"
wasmtime = { version = "=48.0.7", default-features = false, features = ["cranelift", "runtime", "std"] }
wat = "=1.261.0"
wasmparser = "=0.261.0"
wasm-encoder = { version = "=0.261.0", features = ["wasmparser"] }
wit-component = { version = "=0.261.0", default-features = false }
fvm-wasm-instrument = "=0.4.0"
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }
libm = { version = "=0.2.16", default-features = false }
dlmalloc = { version = "=0.2.14", features = ["global"] }
# test-only: the reference ChaCha8 the kernel's own implementation is checked against
rand_chacha = "=0.10.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
