# florn workspace (RFC 005 §9). One workspace; crates prefixed `florn-`; dependency direction per
# RFC 005 rule 43, checked in CI by ci/check-deps.py. The root is a virtual manifest; the crate
# `crates/florn` reserves the name `florn`.
[workspace]
# The fuzz targets build with cargo-fuzz on nightly, outside the workspace (RFC 006 rule 7).
exclude = ["fuzz"]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
authors = ["nabbisen"]
repository = "https://github.com/nabbisen/florn"
rust-version = "1.99"
# The crates people consume and their dependency chain set `publish = true` and are on crates.io;
# the kit, the browser crates, the UI crates and the test guests inherit this and stay private.
publish = false

[workspace.dependencies]
# Internal crates
florn-kernel = { path = "crates/florn-kernel", version = "0.2.0" }
florn-abi = { path = "crates/florn-abi", version = "0.2.0" }
florn-model = { path = "crates/florn-model", version = "0.2.0" }
florn-admission = { path = "crates/florn-admission", version = "0.2.0" }
florn-control = { path = "crates/florn-control", version = "0.2.0" }
florn-host = { path = "crates/florn-host", version = "0.2.0" }
florn-engine = { path = "crates/florn-engine", version = "0.2.0" }
florn-engine-wasmtime = { path = "crates/florn-engine-wasmtime", version = "0.2.0" }
florn-engine-web = { path = "crates/florn-engine-web", version = "0.2.0" }
florn-platform = { path = "crates/florn-platform", version = "0.2.0" }
florn-platform-native = { path = "crates/florn-platform-native", version = "0.2.0" }
florn-platform-web = { path = "crates/florn-platform-web", version = "0.2.0" }
florn-guest = { path = "crates/florn-guest", version = "0.2.0" }
florn-guest-network = { path = "crates/florn-guest-network", version = "0.2.0" }
florn-domain-network = { path = "crates/florn-domain-network", version = "0.2.0" }
florn-conformance = { path = "crates/florn-conformance", version = "0.2.0" }
florn-cli = { path = "crates/florn-cli", version = "0.2.0" }
florn-test-guests = { path = "crates/florn-test-guests" }
florn-ui-model = { path = "crates/florn-ui-model", version = "0.2.0" }
florn-ui-scene = { path = "crates/florn-ui-scene", version = "0.2.0" }
# External, pinned (implementation handoff section 2); added to a crate only by the PR that needs it
wit-parser = "=0.261.0"
toml = "=1.1.8"
sha2 = "=0.11.1"
zip = { version = "=9.0.4", default-features = false }
blake3 = "=1.8.7"
wasmtime = { version = "=48.0.7", default-features = false, features = ["cranelift", "runtime", "std"] }
wat = "=1.261.0"
wasmparser = "=0.261.0"
wasm-encoder = { version = "=0.261.0", features = ["wasmparser"] }
wit-component = { version = "=0.261.0", default-features = false }
fvm-wasm-instrument = "=0.4.0"
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }
libm = { version = "=0.2.16", default-features = false }
dlmalloc = { version = "=0.2.14", features = ["global"] }
# test-only: the reference ChaCha8 the kernel's own implementation is checked against
rand_chacha = "=0.10.0"
# The browser shell (RFC 005 rule 38; PR-20): the framework, its catalogue, and the bindings
leptos = { version = "=0.8.20", features = ["csr"] }
leptos_i18n = { version = "=0.6.2", features = ["csr"] }
wasm-bindgen = "=0.2.126"
js-sys = "=0.3.103"
web-sys = "=0.3.103"
console_error_panic_hook = "=0.1.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
# No symbol names in a release artefact: the worker module shrinks by a fifth.
strip = "symbols"
